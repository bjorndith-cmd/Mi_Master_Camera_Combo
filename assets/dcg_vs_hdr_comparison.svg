<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="850" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="425" y="38" fill="#f8fafc" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    HDR COMPARISON: Multi-Frame Ghosting vs Hardware DCG (Dual Conversion Gain)
  </text>
  <text x="425" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Behavior during rapid movement in high-contrast lighting
  </text>

  <!-- Left Panel: Multi-Frame Staggered HDR -->
  <g transform="translate(30, 85)">
    <rect width="380" height="205" rx="12" fill="url(#badGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="120" height="24" rx="6" fill="#ef4444"/>
    <text x="75" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">STOCK HDR (STAGGERED)</text>

    <!-- Visual icon of ghosted hand/object -->
    <circle cx="190" cy="90" r="28" fill="#ef4444" opacity="0.25"/>
    <circle cx="205" cy="90" r="28" fill="#ef4444" opacity="0.45"/>
    <circle cx="220" cy="90" r="28" fill="#ef4444" opacity="0.85"/>
    
    <text x="190" y="145" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">❌ Motion Ghosting / Двоение контуров</text>
    <text x="190" y="168" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="sans-serif">Склейка 3 отдельных кадров во времени</text>
    <text x="190" y="186" fill="#94a3b8" font-size="10.5" text-anchor="middle" font-family="sans-serif">Движущийся объект размазывается и двоится</text>
  </g>

  <!-- Right Panel: Hardware DCG -->
  <g transform="translate(440, 85)">
    <rect width="380" height="205" rx="12" fill="url(#goodGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="140" height="24" rx="6" fill="#10b981"/>
    <text x="85" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">MASTER DCG (SINGLE EXPOSURE)</text>

    <!-- Visual icon of crisp single object with dual gain rings -->
    <circle cx="190" cy="90" r="28" fill="#10b981" opacity="0.95"/>
    <circle cx="190" cy="90" r="35" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>
    
    <text x="190" y="145" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">✅ Zero Motion Ghosting / Чёткие края</text>
    <text x="190" y="168" fill="#cbd5e1" font-size="11.5" text-anchor="middle" font-family="sans-serif">LCG (Света) + HCG (Тени) с ОДНОГО кадра</text>
    <text x="190" y="186" fill="#94a3b8" font-size="10.5" text-anchor="middle" font-family="sans-serif">Мгновенный параллельный аналоговый опрос пикселя</text>
  </g>
</svg>
