<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="blockSensor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blockISP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="blockNPU" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="blockOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="460" rx="16" fill="url(#bg2)"/>
  <rect width="998" height="458" x="1" y="1" rx="15" fill="none" stroke="#232f45" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="45" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Xiaomi AISP: Аппаратный NPU-пайплайн 4-LM</text>
  <text x="50" y="70" font-family="-apple-system,sans-serif" font-size="13" fill="#94a3b8">On-Device Snapdragon 8 Gen 2 / Gen 3 / 8 Elite Hexagon NPU &amp; Spectra ISP</text>

  <!-- Flow 1: Sensor -->
  <g transform="translate(40, 105)">
    <rect width="180" height="300" rx="10" fill="url(#blockSensor)" stroke="#475569" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#334155"/>
    <text x="90" y="22" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">1. КВАД-СЕНСОРЫ</text>
    
    <text x="15" y="60" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#94a3b8">СЫРОЙ ПОТОК (RAW16):</text>
    <text x="15" y="80" font-family="-apple-system,sans-serif" font-size="11" fill="#cbd5e1">• 1" Sony LYT-900 / IMX989</text>
    <text x="15" y="100" font-family="-apple-system,sans-serif" font-size="11" fill="#cbd5e1">• 200Мп Samsung HP9</text>
    <text x="15" y="120" font-family="-apple-system,sans-serif" font-size="11" fill="#cbd5e1">• 50Мп Sony IMX858 / JN5</text>

    <line x1="15" y1="140" x2="165" y2="140" stroke="#334155" stroke-width="1"/>
    
    <text x="15" y="165" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#94a3b8">АППАРАТНЫЙ СТЕК:</text>
    <text x="15" y="185" font-family="-apple-system,sans-serif" font-size="11" fill="#38bdf8">✓ DCG / iDCG HDR (LCG+HCG)</text>
    <text x="15" y="205" font-family="-apple-system,sans-serif" font-size="11" fill="#38bdf8">✓ 4-Cell Quad-Bayer</text>
    <text x="15" y="225" font-family="-apple-system,sans-serif" font-size="11" fill="#38bdf8">✓ maxRAWSizes = 55</text>
    <text x="15" y="245" font-family="-apple-system,sans-serif" font-size="11" fill="#38bdf8">✓ Chromatix калибровки</text>

    <text x="90" y="285" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Без двоения при движении</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 225 255 L 265 255" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Flow 2: Spectra ISP -->
  <g transform="translate(275, 105)">
    <rect width="180" height="300" rx="10" fill="url(#blockISP)" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#1d4ed8"/>
    <text x="90" y="22" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">2. SPECTRA ISP</text>

    <text x="15" y="60" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#93c5fd">ПЕРВИЧНЫЙ ПАЙПЛАЙН:</text>
    <text x="15" y="80" font-family="-apple-system,sans-serif" font-size="11" fill="#e0e7ff">• Аппаратный Remosaic</text>
    <text x="15" y="100" font-family="-apple-system,sans-serif" font-size="11" fill="#e0e7ff">• 3.2 Гпикс/сек обработка</text>
    <text x="15" y="120" font-family="-apple-system,sans-serif" font-size="11" fill="#e0e7ff">• Дебайеризация RGGB</text>

    <line x1="15" y1="140" x2="165" y2="140" stroke="#1e40af" stroke-width="1"/>

    <text x="15" y="165" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#93c5fd">ОПТИМИЗАЦИЯ МОДА:</text>
    <text x="15" y="185" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa">✓ AISP NR Bypass (нет мыла)</text>
    <text x="15" y="205" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa">✓ 8K Video 24/30fps</text>
    <text x="15" y="225" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa">✓ 4K 120fps High Bitrate</text>
    <text x="15" y="245" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa">✓ 60fps гладкий видоискатель</text>

    <text x="90" y="285" font-family="-apple-system,sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">Передача кадров в NPU</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 460 255 L 500 255" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Flow 3: Hexagon NPU 4-LM -->
  <g transform="translate(510, 105)">
    <rect width="250" height="300" rx="10" fill="url(#blockNPU)" stroke="#9333ea" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#7e22ce"/>
    <text x="125" y="22" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">3. HEXAGON NPU (4-LM)</text>

    <rect x="12" y="48" width="226" height="50" rx="6" fill="#3b0764"/>
    <text x="20" y="68" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#f0abfc">⚡ FusionLM</text>
    <text x="20" y="85" font-family="-apple-system,sans-serif" font-size="10" fill="#d8b4fe">Склейка экспозиций попиксельно</text>

    <rect x="12" y="105" width="226" height="50" rx="6" fill="#3b0764"/>
    <text x="20" y="125" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#f0abfc">🎨 ToneLM &amp; ColorLM</text>
    <text x="20" y="142" font-family="-apple-system,sans-serif" font-size="10" fill="#d8b4fe">Аналоговая кривая цвета Leica</text>

    <rect x="12" y="162" width="226" height="50" rx="6" fill="#3b0764"/>
    <text x="20" y="182" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#f0abfc">🎯 PortraitLM (3D Боке)</text>
    <text x="20" y="199" font-family="-apple-system,sans-serif" font-size="10" fill="#d8b4fe">Оптика Noctilux 50 f/0.95</text>

    <rect x="12" y="219" width="226" height="68" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="238" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4ade80">🛡️ 100% OFFLINE ОБРАБОТКА</text>
    <text x="20" y="254" font-family="-apple-system,sans-serif" font-size="10" fill="#bbf7d0">Отрезаны сервера КНР. Нет задержек,</text>
    <text x="20" y="270" font-family="-apple-system,sans-serif" font-size="10" fill="#bbf7d0">нет зависаний, розовый шум устранён!</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 765 255 L 800 255" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Flow 4: Leica Output -->
  <g transform="translate(805, 105)">
    <rect width="160" height="300" rx="10" fill="url(#blockOut)" stroke="#db2777" stroke-width="1.5"/>
    <rect width="160" height="32" rx="10" fill="#be185d"/>
    <text x="80" y="22" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">4. ИТОГОВЫЙ КАДР</text>

    <text x="15" y="65" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#fbcfe8">ШЕДЕВР LEICA:</text>
    <text x="15" y="90" font-family="-apple-system,sans-serif" font-size="11" fill="#fdf2f8">• Leica Authentic</text>
    <text x="15" y="110" font-family="-apple-system,sans-serif" font-size="11" fill="#fdf2f8">• Leica Vibrant</text>
    <text x="15" y="130" font-family="-apple-system,sans-serif" font-size="11" fill="#fdf2f8">• Master Portraits</text>
    <text x="15" y="150" font-family="-apple-system,sans-serif" font-size="11" fill="#fdf2f8">• 50М/200М Ultra RAW</text>
    <text x="15" y="170" font-family="-apple-system,sans-serif" font-size="11" fill="#fdf2f8">• 8K George Video</text>

    <circle cx="80" cy="225" r="22" fill="#e11d48"/>
    <text x="80" y="231" font-family="-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">Leica</text>

    <text x="80" y="275" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">Мгновенный спуск</text>
  </g>
</svg>
