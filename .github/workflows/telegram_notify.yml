name: Telegram Channel Notification

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Type of post to send'
        required: true
        default: 'announcement'
        type: choice
        options:
          - announcement
          - release
          - push
          - custom
      custom_title:
        description: 'Custom Title (optional)'
        required: false
        default: ''
        type: string
      custom_text:
        description: 'Custom message body (optional)'
        required: false
        default: ''
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Send Notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_POST_TYPE: ${{ inputs.post_type }}
          INPUT_CUSTOM_TITLE: ${{ inputs.custom_title }}
          INPUT_CUSTOM_TEXT: ${{ inputs.custom_text }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning ::TELEGRAM_BOT_TOKEN is not set in GitHub Secrets. Please configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository settings (Settings -> Secrets and variables -> Actions)."
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            python3 tools/send_telegram_post.py \
              --type release \
              --tag "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_BODY" \
              --photo "assets/LOGO.jpg"
          elif [ "$EVENT_NAME" = "push" ]; then
            python3 tools/send_telegram_post.py \
              --type push \
              --tag "$COMMIT_SHA" \
              --title "$COMMIT_AUTHOR" \
              --notes "$COMMIT_MESSAGE" \
              --photo "assets/LOGO.jpg"
          else
            python3 tools/send_telegram_post.py \
              --type "$INPUT_POST_TYPE" \
              --title "$INPUT_CUSTOM_TITLE" \
              --text "$INPUT_CUSTOM_TEXT" \
              --photo "assets/LOGO.jpg"
          fi
