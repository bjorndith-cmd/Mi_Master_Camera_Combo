name: Publish Release Announcement to Telegram

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - 'releases/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send Announcement
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Secrets not configured, skipping."
            exit 0
          fi

          python3 -c '
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN", "").strip().strip("\"'\''")
          chat_id = os.environ.get("TG_CHAT", "").strip().strip("\"'\''")

          if not chat_id.startswith("@") and not chat_id.startswith("-"):
              if "t.me/" in chat_id:
                  chat_id = "@" + chat_id.split("t.me/")[-1].strip("/")
              else:
                  chat_id = "@" + chat_id

          text = """📸⚡️ <b>ГРАНДИОЗНЫЙ РЕЛИЗ: Xiaomi Master Camera Combo 6 v8.2!</b>\n\n<b>Автор порта:</b> @borndead\n<b>База приложения:</b> Xiaomi Leica Camera APK v6.8 (Android 16 / HyperOS 3.0)\n<b>Целевое устройство:</b> Xiaomi 13 Ultra (<code>ishtar</code>, Snapdragon 8 Gen 2)\n<b>Платформы:</b> Standalone APK (Core Patch) + Magisk / KernelSU / APatch\n<b>Поддерживаемые ОС:</b> HyperOS 1.0 – 3.0 • Android 14 – 16\n\nДолгожданный прорыв в мобильной фотографии! Впервые камера новейшего поколения 6.8 с расширенными алгоритмами Leica полностью портирована и запущена на Xiaomi 13 Ultra без вылетов и с полным сохранением аппаратных функций!\n\n🔥 <b>КЛЮЧЕВЫЕ НОВОВВЕДЕНИЯ И ИСПРАВЛЕНИЯ В 6 v8.2:</b>\n\n1️⃣ <b>Устранение краша Chi-CDK HAL (SIGABRT &amp; Черный экран)</b>\nШтатная камера 6.8 вызывала падение драйвера камеры Qualcomm (<code>chxusecase.cpp</code> CamxResultEFailed) из-за запроса недоступных режимов сессии MIVI 3.0 (0x9005). Байткод всех 11 DEX-файлов модифицирован: сессии переведены в стабильный Camera2 HAL режим, обеспечивая мгновенный запуск и плавный видоискатель.\n\n2️⃣ <b>Разблокировка кнопки «+» для импорта LUT в Про-режиме</b>\nВ стоковой версии кнопка добавления пользовательских LUT была заблокирована. Пропатчен адаптер панели фильтров в DEX: теперь доступен импорт .cube, ZIP-архивов и QR-кодов пресетов в 1 касание!\n\n3️⃣ <b>Разблокировка вкладок «Улучшения / Бьютификация» в Портрете</b>\nВосстановлены фирменные регуляторы сглаживания кожи, моделирования черт лица и студийного освещения портретов.\n\n4️⃣ <b>Оффлайн MIVI Daemon Handshake</b>\nУстранена 12-секундная задержка при спуске затвора: клиент <code>AidlBGServiceClient</code> переведён в автономный режим, не требующий отсутствующего системного сервиса.\n\n5️⃣ <b>Quad-Lens Zoom (0.5x – 10x) &amp; Dual Aperture (F1.9 / F4.0)</b>\nПолное переключение между всеми 4 сенсорами (Sony IMX989 + 3x IMX858) и механическое управление физической диафрагмой основного модуля.\n\n6️⃣ <b>Два удобных формата поставки</b>\n• <b>Прямой APK:</b> Установка поверх системы за 5 секунд через Core Patch (без перезагрузки).\n• <b>Magisk/KernelSU ZIP:</b> Полноценный системный модуль с Zero-ETC архитектурой, 49 нативными библиотеками и авто-защитой от бутлупа.\n\n📦 <b>СКАЧАТЬ СБОРКИ:</b>\n👉 <a href=\"https://github.com/bjorndith-cmd/Mi_Master_Camera_Combo/releases/latest\">GitHub Release</a>\n👉 <a href=\"https://github.com/bjorndith-cmd/Mi_Master_Camera_Combo\">Репозиторий проекта</a>\n\n💬 <b>Официальный чат и поддержка:</b> @Mi_Master_Camera_Combo\n<i>Разработано с заботой о мобильной фотографии by borndead ❤️</i>"""

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  if res.get("ok"):
                      print("Announcement published to Telegram successfully!")
                  else:
                      print("Response:", res)
          except Exception as e:
              print("Status:", e)
          '

