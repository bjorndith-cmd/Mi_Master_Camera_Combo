name: Publish Release Announcement to Telegram

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - 'releases/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send Announcement
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Secrets not configured, skipping."
            exit 0
          fi

          python3 -c '
          import os, json, urllib.request

          token = os.environ.get("TG_TOKEN", "").strip().strip("\"'\''")
          chat_id = os.environ.get("TG_CHAT", "").strip().strip("\"'\''")

          if not chat_id.startswith("@") and not chat_id.startswith("-"):
              if "t.me/" in chat_id:
                  chat_id = "@" + chat_id.split("t.me/")[-1].strip("/")
              else:
                  chat_id = "@" + chat_id

          text = """📸⚡️ <b>ГРАНДИОЗНЫЙ РЕЛИЗ: Xiaomi Master Camera Combo 5 v6.6 EU (LOCAL AI PACK)!</b>\n\n<b>Автор сборки:</b> @borndead\n<b>Целевое устройство:</b> Xiaomi 13 Ultra (<code>ishtar</code>, Snapdragon 8 Gen 2)\n<b>Прошивка:</b> xiaomi.eu • HyperOS 3.0 / Android 16 (API 36)\n<b>Базовое ядро:</b> Universal 5.0 Beta 8.3 (599830000, 55 нативных библиотек, 16KB ELF aligned)\n<b>Формат:</b> Magisk / KernelSU / APatch Module\n\nМасштабное обновление флагманского комбо для Xiaomi 13 Ultra на Android 16! Впервые активирован полноценный аппаратный ИИ-пак, работающий строго локально на чипе Snapdragon 8 Gen 2 (NPU/DSP) с полным отключением облачных сервисов.\n\n🔥 <b>КЛЮЧЕВЫЕ НОВОВВЕДЕНИЯ В 5 v6.6 EU:</b>\n\n1️⃣ <b>Локальный аппаратный ИИ-пак (LOCAL AI PACK на NPU)</b>\n• <b>Xiaomi AISP:</b> Нейросетевая обработка тональности, динамического диапазона и микроконтраста на NPU.\n• <b>AINR:</b> Глубокое шумоподавление в сумерках и ночных сценах.\n• <b>CyberFocus 2.0:</b> Предиктивное удержание фокуса на движущихся объектах.\n• <b>MIVI Super Resolution:</b> Аппаратное повышение детализации и текстур.\n• <b>AI-сцена (ASD) / AI-коуч / AI-режиссёр:</b> Мгновенное локальное распознавание сцен.\n• <b>ИИ-редактор галереи:</b> Активация меток HyperAI для умного ластика и расширения кадра.\n• <b>100% приватность:</b> Все вычисления происходят исключительно на процессоре телефона, передача данных в облако заблокирована (<code>cloud.*=0</code>).\n\n2️⃣ <b>Интерактивное Action-меню (Magisk / KernelSU)</b>\n• Добавлен переключатель <code>10) Toggle LOCAL AI pack</code>: мгновенный выбор между качеством ИИ и чистой скоростью затвора (классический прямой ISP).\n• Доступны тумблеры <code>8) Toggle AISP/ASD</code>, <code>9) Toggle 50 MP envelope</code> и пункт подробной диагностики <code>1) Status</code>.\n\n3️⃣ <b>Плавный оптический зум в видео (Video SAT)</b>\nБесшовный переход между всеми 4 физическими объективами (0.5x ↔ 1.0x ↔ 3.2x ↔ 5.0x) прямо во время непрерывной видеосъёмки с аппаратной синхронизацией кадров.\n\n4️⃣ <b>Честные 50 Мп на всех 4 камерах &amp; Stepless диафрагма</b>\nПолный конверт 8192×6144 для всех модулей, плавное переключение физического ириса f/1.9 ↔ f/4.0 и режим Street Photography с гиперфокальной шкалой.\n\n5️⃣ <b>Исправление EPERM и расширенные логи</b>\nПрава на кэш и конфигурации приведены к <code>media_rw</code>: камера больше не спамит ошибками доступа. Логи в <code>/sdcard/Download/CameraMod_Logs</code> теперь в реальном времени отслеживают переключение линз и работу AISP.\n\n6️⃣ <b>Полный мануал по настройкам</b>\nВ репозиторий добавлен подробнейший гайд на русском языке по всем режимам, лабораторным настройкам и готовым профилям (<code>MANUAL_Mi13U_v6.6_EU_RU.md</code>).\n\n📦 <b>СКАЧАТЬ СБОРКУ:</b>\n👉 <a href=\"https://github.com/bjorndith-cmd/Mi_Master_Camera_Combo/releases\">GitHub Releases</a>\n👉 <a href=\"https://github.com/bjorndith-cmd/Mi_Master_Camera_Combo\">Репозиторий проекта</a>\n\n💬 <b>Официальный чат и поддержка:</b> @Mi_Master_Camera_Combo\n<i>Собрано для сообщества мобильной фотографии by borndead ❤️</i>"""

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  if res.get("ok"):
                      print("Announcement published to Telegram successfully!")
                  else:
                      print("Response:", res)
          except Exception as e:
              print("Status:", e)
          '

